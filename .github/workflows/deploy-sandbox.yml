name: Deploy sandbox

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SANDBOX_SSH_HOST }}
          port: ${{ secrets.SANDBOX_SSH_PORT || 22 }}
          username: ${{ secrets.SANDBOX_SSH_USER }}
          key: ${{ secrets.SANDBOX_SSH_KEY }}
          passphrase: ${{ secrets.SANDBOX_SSH_KEY_PASSPHRASE }}
          script: |
            set -e
            cd ${{ secrets.SANDBOX_DEPLOY_PATH }}
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev
            cd deploy
            export COMMIT_SHA=$(git rev-parse --short HEAD)
            export BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            docker compose up -d --build
